name: Alinea Health
description: 'Alinea Health is an AI-powered clinical trial recruitment intelligence
  platform that analyzes global trial registry data (ClinicalTrials.gov, ISRCTN, EU
  CTR) alongside patient availability to detect enrollment risk before it causes delays
  and to match eligible patients to appropriate studies for sponsors, CROs, sites,
  and healthcare providers. The platform surfaces at-risk trials, benchmarks sites,
  and visualizes enrollment pipelines, positioning delay prevention as protecting
  $1.1M-$1.7M per month in trial spend. The company advertises enterprise-grade RESTful
  APIs and custom data pipelines with end-to-end encryption and SOC 2 compliance,
  but publishes no public developer portal, API reference, or machine-readable specification;
  access is gated behind a partner platform and an early-access program. Backed by
  General Catalyst, with offices in Toronto and Barcelona.'
